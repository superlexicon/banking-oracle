[package]
name = "banking-oracle"
version = "0.1.0"
edition = "2021"
description = "Multi-entity, multi-bank, multi-currency Banking & Payment Acquiring Oracle with two-stage sweep reconciliation for SuperLexicon HFS"
license = "LicenseRef-Proprietary"

[[bin]]
name = "banking-oracle"
path = "src/main.rs"

[lib]
name = "banking_oracle"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
axum = "0.6"
base64 = "0.21"
chrono = { version = "0.4", features = ["serde"] }
ethereum-types = "0.14"
hex = "0.4"
hmac = "0.12"
indexmap = { version = "2.0", features = ["serde"] }
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"] }
rlp = "0.5"
secp256k1 = { version = "0.28", features = ["recovery", "rand-std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sha3 = "0.10"
thiserror = "1.0"
tokio = { version = "1.0", features = ["full"] }
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.0", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3.8"
